---
# ReSpeaker 2-Mic HAT configuration

hat_type: "2mic"
satellite_id: "sat-wohnzimmer"
satellite_room: "Wohnzimmer"

# Audio (stereo with beamforming)
audio_device: "capture"
audio_playback_device: "plughw:0,0"
audio_channels: 2
beamforming_enabled: true
beamforming_mic_spacing: 0.058

# WM8960 ALC (hardware AGC) — same conversational-volume wake-word fix as
# Arbeitszimmer. The 2-Mic V1 HAT is WM8960-based and exposes the ALC controls
# (verified 2026-06-24). NOTE: this HAT's ALSA card is `seeed2micvoicec`, not the
# whisplay default. Tunables inherit from group_vars/satellites.yml.
wm8960_alc_enabled: true
wm8960_alsa_card: "seeed2micvoicec"

# LEDs (2-Mic HAT: 3 LEDs on SPI 0:0, no power pin)
led_num: 3
led_spi_device: 0
led_power_pin: null

# IDLE LED color for visual identification
led_idle_color: "green"

# 2-mic overlay variant: "simple" or "full"
overlay_variant: "simple"

# BLE presence: keep one scanner running continuously (vs 30 s bursts) so the
# weak Pi Zero radio is more likely to catch a phone's intermittent adverts.
# Enabled here because this room sits at the edge of phone BLE range.
ble_continuous: true
