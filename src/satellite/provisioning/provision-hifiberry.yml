---
# Renfield HiFiBerry (DLNA renderer) hostname provisioning
#
# WHY this exists
# ---------------
# Renfield delivers TTS audio to renderers over **http** (ADVERTISE_SCHEME=http,
# `http://renfield.local/api/voice/tts-cache/...`), so the self-signed-cert TLS
# problem that used to require installing the Renfield CA on the HiFiBerry is
# GONE. (TTS-DLNA went http because Samsung TVs can't do the self-signed https;
# http works on every renderer — see docs/MESSAGE_RELAY.md.)
#
# ONE thing still needs fixing on the HiFiBerry: name resolution. nsswitch is
# `hosts: files resolve [!UNAVAIL=return] dns`, so systemd-resolved grabs the
# `.local` name as mDNS and returns NOTFOUND BEFORE plain DNS is tried. (curl
# works only because it uses its own c-ares resolver; gstreamer/getaddrinfo does
# not.) So gstreamer can't resolve `renfield.local` and TTS fails SILENTLY (the
# renderer reports state=playing, fetches nothing). This playbook pins
# `renfield.local -> the LB IP` in /etc/hosts and restarts the DLNA service so
# gstreamer re-resolves.
#
# Linn / openHome renderers need none of this (they resolve via DNS natively).
#
# IDEMPOTENT + re-runnable. A HiFiBerryOS update wipes the /etc/hosts edit, so
# re-run this playbook after any OS update.
#
# Usage:
#   ansible-playbook -i inventory.yml provision-hifiberry.yml --ask-pass --limit hifiberry-arbeitszimmer
#   ansible-playbook -i inventory.yml provision-hifiberry.yml --ask-pass --check   # dry-run
#
# Tags: hosts
#
# NOTE (history): an earlier version of this play also installed the cluster's
# self-signed CA into the renderer trust store for https TTS. That step was
# removed when TTS delivery moved to http (the CA was the only reason it existed).
# If https delivery is ever revisited, the CA can be fetched fresh with:
#   openssl s_client -connect 192.168.1.230:443 -servername renfield.local </dev/null 2>/dev/null \
#     | openssl x509 -outform PEM > files/renfield-ca.pem
#
# See docs/MESSAGE_RELAY.md ("TTS audio delivery to renderers").

- name: Provision HiFiBerry DLNA renderer for Renfield (http TTS — .local resolution)
  hosts: hifiberry
  become: false # the HiFiBerry login user is root; Buildroot has no sudo
  gather_facts: false

  vars:
    renfield_advertise_host: renfield.local
    renfield_advertise_ip: 192.168.1.230
    dlna_service: dlnampris.service

  handlers:
    # Graceful restart (systemd stop/start) — NOT a SIGKILL. The HiFiBerry is not
    # a fragile Pi Zero satellite, but keep it graceful so the SD card syncs.
    # Needed so a renderer that previously cached a failed renfield.local lookup
    # re-resolves against the new /etc/hosts entry.
    - name: restart dlna renderer
      ansible.builtin.systemd:
        name: "{{ dlna_service }}"
        state: restarted

  tasks:
    - name: Pin renfield.local -> LB IP (systemd-resolved hijacks .local via mDNS)
      tags: [hosts]
      ansible.builtin.lineinfile:
        path: /etc/hosts
        # match the hostname as a token (allow a trailing alias/comment) so a
        # pre-existing entry is replaced, never duplicated.
        regexp: '^\d[\d.]*\s+{{ renfield_advertise_host | regex_escape }}(\s|$)'
        line: "{{ renfield_advertise_ip }} {{ renfield_advertise_host }}"
        state: present
      notify: restart dlna renderer
